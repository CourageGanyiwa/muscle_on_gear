{% extends "layouts/base.html" %} {% block title %}Create Order - Muscle On
Gear{% endblock %} {% block extra_styles %}
<style>
  :root {
    --bg-start: #0a0a0a;
    --bg-end: #0d0d0d;
    --muted: #a3b2c7;
    --accent-red: #ef4444;
    --accent-red-dark: #dc2626;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", system-ui, sans-serif;
    color: #e2e8f0;
    background:
      radial-gradient(
        circle at top left,
        rgba(239, 68, 68, 0.12),
        transparent 22%
      ),
      linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
  }

  .container {
    padding: 32px 24px;
    max-width: 1140px;
  }

  .card {
    border-radius: 24px !important;
    background: rgba(26, 26, 26, 0.84) !important;
    border: 1px solid rgba(239, 68, 68, 0.12) !important;
    box-shadow: 0 22px 44px rgba(26, 26, 26, 0.18) !important;
  }

  .card-body {
    padding: 24px;
  }

  .product-card {
    min-height: auto;
  }

  .product-card .card-body {
    padding: 16px;
  }

  .product-card .form-check {
    margin-bottom: 0.75rem;
  }

  .product-card .form-label {
    margin-bottom: 0.35rem;
    font-size: 0.95rem;
  }

  .product-card .form-control {
    padding: 0.5rem 0.75rem;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
  }

  .product-grid-item {
    width: 100%;
  }

  @media (max-width: 768px) {
    .product-grid {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
  }

  .form-label {
    color: #e2e8f0 !important;
  }

  .form-control,
  .form-select {
    background: rgba(255, 255, 255, 0.05) !important;
    border: 1px solid rgba(239, 68, 68, 0.16) !important;
    color: #e2e8f0 !important;
  }

  .form-control:focus,
  .form-select:focus {
    border-color: #ef4444 !important;
    box-shadow: 0 0 0 0.2rem rgba(239, 68, 68, 0.18) !important;
    color: #e2e8f0 !important;
  }

  .form-check-input {
    background: rgba(255, 255, 255, 0.05) !important;
    border: 1px solid rgba(239, 68, 68, 0.16) !important;
    width: 20px;
    height: 20px;
    cursor: pointer;
  }

  .form-check-input:checked {
    background-color: #ef4444 !important;
    border-color: #dc2626 !important;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='M6 10l3 3l5-5'/%3e%3c/svg%3e") !important;
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
  }

  .form-check-input:focus {
    border-color: #ef4444 !important;
    box-shadow: 0 0 0 0.2rem rgba(239, 68, 68, 0.25) !important;
  }

  .form-check-label {
    color: #e2e8f0 !important;
  }

  .text-muted {
    color: var(--muted) !important;
  }

  .btn-success {
    background-color: #ef4444 !important;
    border-color: #dc2626 !important;
    color: #ffffff !important;
    min-width: 140px;
  }

  .btn-success:hover,
  .btn-success:focus {
    background-color: #dc2626 !important;
    border-color: #991b1b !important;
  }
</style>
{% endblock %} {% block content %}
<div class="container py-4">
  <!-- Header -->
  <div
    class="mb-5"
    style="
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 28px 60px rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(12px);
    "
  >
    <div
      class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3"
    >
      <div>
        <h1 class="fw-bold mb-2">Create Order</h1>
        <p class="text-muted mb-0">Select products and quantities</p>
      </div>

      <div class="d-flex gap-2">
        <a href="/dashboard" class="btn btn-outline-primary rounded"
          >Back to Dashboard</a
        >
        <a href="/inventory" class="btn btn-outline-info rounded">Inventory</a>
        <a href="/logout" class="btn btn-outline-danger rounded">Logout</a>
      </div>
    </div>
  </div>

  <!-- Form -->
  <form method="POST">
    <!-- Customer Card -->
    <div class="card mb-4">
      <div class="card-body">
        <label class="form-label fw-semibold">Customer Name</label>
        <input type="text" name="customer_name" class="form-control" required />
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Order Date</label>

      <input
        type="date"
        name="order_date"
        value="{{ current_date }}"
        class="form-control"
      />
    </div>
    <!-- Products -->
    <div class="product-grid mb-5">
      {% for p in products %}
      <div class="product-grid-item">
        <div class="card h-100 product-card">
          <div class="card-body">
            <!-- Select product -->
            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                name="product_{{ p.id }}"
                value="1"
              />

              <label class="form-check-label fw-semibold"> {{ p.name }} </label>
            </div>

            <!-- Quantity -->
            <label class="form-label text-muted">Quantity</label>

            <input
              type="number"
              class="form-control"
              name="qty_{{ p.id }}"
              min="0"
              placeholder="0"
            />
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <!-- Submit Button -->
    <div class="text-end">
      <button type="submit" class="btn btn-outline-primary btn-lg">
        Create Order
      </button>
    </div>
  </form>
</div>
<script>
  // Auto-dismiss flash message toast after 5 seconds
  document.addEventListener("DOMContentLoaded", function () {
    const toasts = document.querySelectorAll(".toast");
    toasts.forEach((toast) => {
      const bsToast = new bootstrap.Toast(toast);
      bsToast.show();
      setTimeout(() => {
        bsToast.hide();
      }, 5000);
    });
  });
</script>
{% endblock %}
